<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="55%" stop-color="#FF8E53"/>
      <stop offset="100%" stop-color="#FFB088"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- decorative pins (a few small dots scattered) -->
  <g fill="rgba(255,255,255,0.25)">
    <circle cx="120"  cy="120" r="8"/>
    <circle cx="1080" cy="100" r="6"/>
    <circle cx="180"  cy="520" r="10"/>
    <circle cx="1020" cy="530" r="9"/>
    <circle cx="950"  cy="180" r="5"/>
    <circle cx="240"  cy="270" r="4"/>
  </g>

  <!-- compass-style emblem (subtle, behind text) -->
  <g transform="translate(600,200)" opacity="0.10">
    <circle r="180" fill="none" stroke="white" stroke-width="4"/>
    <circle r="120" fill="none" stroke="white" stroke-width="3"/>
    <path d="M0 -160 L20 0 L0 160 L-20 0 Z" fill="white"/>
  </g>

  <!-- ROOTSY wordmark -->
  <text x="600" y="290"
        text-anchor="middle"
        font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
        font-weight="900"
        font-size="148"
        letter-spacing="-4"
        fill="white"
        filter="url(#shadow)">Rootsy</text>

  <!-- TAGLINE -->
  <text x="600" y="380"
        text-anchor="middle"
        font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
        font-weight="600"
        font-size="42"
        fill="white"
        opacity="0.95">Sentiti a casa, ovunque</text>

  <!-- BADGE 13 LINGUE -->
  <g transform="translate(600,470)">
    <rect x="-160" y="-28" width="320" height="56" rx="28"
          fill="rgba(255,255,255,0.18)"
          stroke="rgba(255,255,255,0.45)"
          stroke-width="1.5"/>
    <text x="0" y="8"
          text-anchor="middle"
          font-family="Inter, sans-serif"
          font-weight="700"
          font-size="22"
          fill="white">31 lingue · per expat &amp; viaggiatori</text>
  </g>

  <!-- domain bottom -->
  <text x="600" y="580"
        text-anchor="middle"
        font-family="Inter, sans-serif"
        font-weight="600"
        font-size="22"
        fill="white"
        opacity="0.85">myrootsy.com</text>
</svg>
