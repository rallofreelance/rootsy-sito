# ============================================================
# Netlify — sito pubblico myrootsy.com
# ============================================================
# Il sito è fatto di file HTML pronti. Prima di pubblicare la cartella deploy/,
# Netlify crea una pagina per ogni lingua (deploy/de/, deploy/en/ ...) con
# scripts/build-lang-pages.mjs: così Google trova il sito in tutte le 31 lingue.
#
#   - modifica salvata sul ramo "main"        → va online su myrootsy.com
#   - proposta di modifica (Pull Request)     → link di ANTEPRIMA da controllare
# ============================================================

[build]
  publish = "deploy"
  command = "node scripts/build-lang-pages.mjs"

# Collegamenti alle app (Apple / Android): devono essere letti come JSON
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache, max-age=0"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache, max-age=0"

# Protezioni di sicurezza standard per tutte le pagine
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
